<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- 노트북: 화면 + 베이스 -->
  <g transform="translate(18,20) rotate(-6)">
    <rect x="0" y="0" width="30" height="18" fill="none" stroke="rgba(17,17,17,0.07)" stroke-width="2"/>
    <rect x="-5" y="18" width="40" height="4" fill="none" stroke="rgba(17,17,17,0.07)" stroke-width="2"/>
  </g>

  <!-- 코드 브래킷 </> -->
  <g transform="translate(150,14) rotate(4)">
    <path d="M6 2 L0 12 L6 22" fill="none" stroke="rgba(17,17,17,0.07)" stroke-width="2" stroke-linecap="square"/>
    <path d="M20 2 L26 12 L20 22" fill="none" stroke="rgba(17,17,17,0.07)" stroke-width="2" stroke-linecap="square"/>
    <line x1="16" y1="0" x2="10" y2="24" stroke="rgba(17,17,17,0.07)" stroke-width="2"/>
  </g>

  <!-- 터미널: 창 + 프롬프트 -->
  <g transform="translate(28,138) rotate(3)">
    <rect x="0" y="0" width="32" height="22" fill="none" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="0" y1="7" x2="32" y2="7" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <path d="M5 13 L10 16.5 L5 20" fill="none" stroke="rgba(17,17,17,0.065)" stroke-width="2" stroke-linecap="square"/>
    <line x1="13" y1="20" x2="20" y2="20" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
  </g>

  <!-- 칩/회로 -->
  <g transform="translate(160,150) rotate(-4)">
    <rect x="4" y="4" width="18" height="18" fill="none" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="0" y1="8" x2="4" y2="8" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="0" y1="16" x2="4" y2="16" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="22" y1="8" x2="26" y2="8" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="22" y1="16" x2="26" y2="16" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="8" y1="0" x2="8" y2="4" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="16" y1="0" x2="16" y2="4" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="8" y1="22" x2="8" y2="26" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
    <line x1="16" y1="22" x2="16" y2="26" stroke="rgba(17,17,17,0.065)" stroke-width="2"/>
  </g>
</svg>
